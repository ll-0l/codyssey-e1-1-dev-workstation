server {
    listen       80;
    server_name  localhost;

    # 응답 헤더에 nginx 버전 노출하지 않기
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # 어느 컨테이너가 응답했는지 확인용 헤더
    add_header X-Served-By $hostname always;

    location / {
        try_files $uri $uri/ =404;
    }

    # 헬스체크 전용 엔드포인트
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
