name: codyssey

services:
  web:
    build: ../app                 # 본 과제에서 만든 커스텀 이미지 재사용
    image: codyssey-web:1.0
    ports:
      - "${WEB_PORT:-8090}:80"    # 호스트 포트는 .env 로 변경 가능
    environment:
      API_PORT: ${API_PORT:-5000}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    volumes:
      - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

  api:
    build: ./api
    image: codyssey-api:1.0
    environment:
      PORT: ${API_PORT:-5000}     # 서버 포트 주입
      APP_MODE: ${APP_MODE:-dev}  # 실행 모드 주입
    expose:
      - "${API_PORT:-5000}"       # 호스트에는 공개하지 않고 내부 네트워크에만
    networks: [backend]

networks:
  backend: {}
